[auth]
# The platform moved to learn.jointeluguai.com. These are what magic links and
# workers.dev hostname changed with it and the old one no longer resolves.
# Update these in the Supabase dashboard too (Authentication -> URL
# Configuration) — magic links and OTP redirects are built from them.
site_url = "https://learn.jointeluguai.com"
additional_redirect_urls = ["https://learn.jointeluguai.com/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8


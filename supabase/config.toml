# Gmail and Yahoo POST here straight from the inbox UI, with no Supabase
# session and no opportunity to obtain one. The signed token in the URL is the
# authorisation.
[functions.unsubscribe]
verify_jwt = false

[functions.generate-page]
verify_jwt = false

[functions.verify-domain]
verify_jwt = false
